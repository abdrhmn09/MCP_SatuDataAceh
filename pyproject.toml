[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satu-data-aceh-mcp"
version = "0.1.0"
description = "MCP server untuk katalog Satu Data Aceh"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pandas>=2.0.0,<3.0.0",
    "tabulate>=0.9.0,<1.0.0",
]

[project.scripts]
satu-data-aceh = "src.server:main"

[tool.setuptools]
packages = ["src"]