# Install as /etc/nginx/sites-available/mcpsatudataaceh.web.id
# This file is included inside nginx's http context on Ubuntu.
map $http_origin $mcp_cors_origin {
    default "";
    "https://mcpplaygroundonline.com" $http_origin;
    "https://mcpsatudataaceh.web.id" $http_origin;
    "https://www.mcpsatudataaceh.web.id" $http_origin;
}
log_format mcp_oauth '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status';
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name mcpsatudataaceh.web.id www.mcpsatudataaceh.web.id;
    root /var/www/mcpsatudataaceh.web.id;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/mcpsatudataaceh.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcpsatudataaceh.web.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / { try_files $uri $uri/ =404; }
    # OAuth endpoints manage their own public-client CORS, without credentials.
    # Log paths without query strings (authorization state / PKCE).
    location ~ ^/(authorize|token|register|revoke|\.well-known/oauth-(authorization-server|protected-resource)(/[^/]*)?)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        client_max_body_size 16k;
        access_log /var/log/nginx/mcp-oauth-access.log mcp_oauth;
    }
    # Preserve the complete path and session query for SSE and Streamable HTTP.
    location ~ ^/(sse|messages|mcp|api/bps|api/account|api/oauth|internal/accounts)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Visitor credentials must reach the application on each request.
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-BPS-API-Key $http_x_bps_api_key;
        proxy_set_header X-BPS-SDGS-Token $http_x_bps_sdgs_token;
        proxy_set_header X-Account-Service-Secret $http_x_account_service_secret;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        client_max_body_size 1m;
        add_header Access-Control-Allow-Origin $mcp_cors_origin always;
        add_header Vary Origin always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept, MCP-Protocol-Version, Mcp-Session-Id, Last-Event-ID, X-BPS-API-Key, X-BPS-SDGS-Token, X-CSRF-Token" always;
        add_header Access-Control-Expose-Headers "Mcp-Session-Id, Location, WWW-Authenticate" always;
        add_header Cache-Control "no-store" always;
        if ($request_method = OPTIONS) { return 204; }
    }
    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name mcpsatudataaceh.web.id www.mcpsatudataaceh.web.id;
    return 301 https://$host$request_uri;
}
