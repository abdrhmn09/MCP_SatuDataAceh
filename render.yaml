services:
  - type: web
    name: satu-data-aceh-mcp
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MCP_TRANSPORT
        value: sse
      - key: MCP_HOST
        value: 0.0.0.0
      - key: SATU_DATA_ACEH_DATA_YEAR
        value: "2025"
      - key: MCP_RATE_LIMIT_PER_MINUTE
        value: "60"
